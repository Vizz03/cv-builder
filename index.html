<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CV Builder · Live Preview + PDF/DOCX</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/docx@7.8.2/build/index.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Inter", sans-serif;
      }
      body {
        background: #f4f6fa;
        padding: 2rem 1.5rem 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
      }
      .app-container {
        max-width: 1400px;
        width: 100%;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 2rem;
        align-items: start;
        flex: 1;
      }

      /* ---------- FORM PANEL ---------- */
      .form-panel {
        background: white;
        border-radius: 24px;
        padding: 2rem;
        box-shadow: 0 20px 35px -8px rgba(0, 0, 0, 0.1);
        border: 1px solid #e9eef3;
        max-height: 85vh;
        overflow-y: auto;
      }
      .form-panel h2 {
        font-size: 1.6rem;
        font-weight: 600;
        color: #0b1c2e;
        margin-bottom: 0.25rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .form-panel h2 i {
        color: #1e7ae6;
        font-size: 1.5rem;
      }
      .subhead {
        color: #5a6d7e;
        font-size: 0.9rem;
        margin-bottom: 1.5rem;
        border-left: 3px solid #1e7ae6;
        padding-left: 0.75rem;
      }
      .form-section {
        margin-bottom: 1.5rem;
        border-bottom: 1px dashed #dbe2e9;
        padding-bottom: 1rem;
      }
      .form-section:last-child {
        border-bottom: none;
      }
      .form-section-title {
        font-weight: 600;
        font-size: 0.9rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: #1e7ae6;
        margin-bottom: 0.75rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .input-group {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
        margin-bottom: 0.75rem;
      }
      .input-group label {
        font-weight: 500;
        font-size: 0.8rem;
        color: #1f2e3c;
        display: flex;
        align-items: center;
        gap: 0.35rem;
      }
      .input-group label i {
        color: #1e7ae6;
        font-size: 0.8rem;
        width: 16px;
      }
      .input-group input,
      .input-group textarea {
        padding: 0.65rem 1rem;
        border: 1.5px solid #dbe2e9;
        border-radius: 14px;
        font-size: 0.9rem;
        background: #fff;
        resize: vertical;
        width: 100%;
      }
      .input-group input:focus,
      .input-group textarea:focus {
        border-color: #1e7ae6;
        outline: none;
        box-shadow: 0 0 0 3px rgba(30, 122, 230, 0.1);
      }
      .row-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.75rem;
      }
      .contact-item,
      .exp-item,
      .edu-item {
        background: #f9fcff;
        border: 1px solid #e7eef6;
        border-radius: 16px;
        padding: 0.8rem 1rem;
        margin-bottom: 0.75rem;
        position: relative;
      }
      .contact-item .remove-btn,
      .exp-item .remove-btn,
      .edu-item .remove-btn {
        position: absolute;
        top: 8px;
        right: 10px;
        background: none;
        border: none;
        color: #a0b3c6;
        cursor: pointer;
        font-size: 0.9rem;
      }
      .contact-item .remove-btn:hover,
      .exp-item .remove-btn:hover,
      .edu-item .remove-btn:hover {
        color: #e74c3c;
      }
      .add-btn {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.5rem 1.2rem;
        border-radius: 40px;
        font-weight: 500;
        font-size: 0.8rem;
        border: 1.5px dashed #b0c7dd;
        background: #f9fcff;
        color: #1e7ae6;
        cursor: pointer;
      }
      .add-btn:hover {
        background: #e8f2fe;
        border-color: #1e7ae6;
      }
      .button-group {
        display: flex;
        flex-wrap: wrap;
        gap: 0.8rem;
        margin-top: 1.5rem;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
        padding: 0.75rem 1.5rem;
        border-radius: 40px;
        font-weight: 500;
        font-size: 0.9rem;
        cursor: pointer;
        background: white;
        border: 1.5px solid #d0dbe8;
        color: #1f2e3c;
      }
      .btn-primary {
        background: #0b1c2e;
        border-color: #0b1c2e;
        color: white;
      }
      .btn-primary:hover {
        background: #1e7ae6;
        border-color: #1e7ae6;
      }
      .btn-outline:hover {
        background: #f0f6fe;
        border-color: #1e7ae6;
      }

      /* ---------- PREVIEW PANEL ---------- */
      .preview-panel {
        position: sticky;
        top: 2rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      .preview-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 0.5rem;
      }
      .preview-header h3 {
        font-weight: 500;
        color: #5a6d7e;
        font-size: 1rem;
        text-transform: uppercase;
      }
      .badge {
        background: #e2eaf3;
        color: #1e4a76;
        border-radius: 30px;
        font-size: 0.75rem;
        padding: 0.3rem 1rem;
        font-weight: 500;
      }
      .cv-paper {
        background: white;
        border-radius: 20px;
        box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.1);
        padding: 2rem;
        border: 1px solid #e2e8f0;
        line-height: 1.5;
        color: #1e2a36;
        max-height: 75vh;
        overflow-y: auto;
      }

      /* ---------- CV STYLING ---------- */
      .cv-name {
        font-size: 2.2rem;
        font-weight: 700;
        color: #0b1c2e;
        line-height: 1.2;
        margin-bottom: 0.25rem;
      }
      .cv-title {
        font-size: 1.1rem;
        font-weight: 500;
        color: #1e7ae6;
        margin-bottom: 0.75rem;
        border-bottom: 2px solid #e5effa;
        padding-bottom: 0.7rem;
      }
      .cv-contact {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        font-size: 0.9rem;
        color: #3f5568;
        margin-bottom: 1.5rem;
        background: #f9fcff;
        padding: 0.7rem 1rem;
        border-radius: 16px;
        border: 1px solid #e7eef6;
      }
      .cv-contact span {
        display: flex;
        align-items: center;
        gap: 0.4rem;
      }
      .cv-contact i {
        color: #1e7ae6;
        width: 16px;
        font-size: 0.9rem;
      }
      .cv-section {
        margin-top: 1.5rem;
      }
      .cv-section-title {
        font-weight: 600;
        font-size: 1rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: #0b1c2e;
        border-bottom: 2px solid #1e7ae6;
        padding-bottom: 0.4rem;
        margin-bottom: 1rem;
        display: inline-block;
      }
      .cv-item {
        margin-bottom: 1.2rem;
      }
      .cv-item-title {
        font-weight: 600;
        font-size: 1rem;
        color: #0b1c2e;
      }
      .cv-item-sub {
        font-weight: 500;
        color: #1e7ae6;
        font-size: 0.9rem;
        margin-bottom: 0.2rem;
      }
      .cv-item-desc {
        font-size: 0.9rem;
        color: #2e4052;
        white-space: pre-line;
      }
      .cv-text-block {
        font-size: 0.9rem;
        color: #2e4052;
        white-space: pre-line;
      }
      .placeholder-text {
        color: #9aaebf;
        font-style: italic;
      }

      /* PDF page-break protection */
      .cv-item,
      .cv-section,
      .cv-contact,
      .cv-name,
      .cv-title {
        break-inside: avoid;
        page-break-inside: avoid;
      }
      .cv-section-title {
        break-after: avoid;
        page-break-after: avoid;
      }

      /* ---------- FOOTER ---------- */
      .app-footer {
        width: 100%;
        max-width: 1400px;
        margin-top: 2.5rem;
        padding: 1.2rem 1rem;
        text-align: center;
        font-size: 0.85rem;
        color: #5a6d7e;
        border-top: 1px solid #e2e8f0;
      }
      .app-footer a {
        color: #1e7ae6;
        text-decoration: none;
        font-weight: 500;
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        transition: color 0.15s;
      }
      .app-footer a:hover {
        color: #0b1c2e;
        text-decoration: underline;
      }
      .app-footer i {
        font-size: 1rem;
      }

      @media (max-width: 950px) {
        .app-container {
          grid-template-columns: 1fr;
          gap: 2rem;
        }
        .preview-panel {
          position: static;
        }
        body {
          padding: 1rem 1rem 0;
        }
        .form-panel {
          max-height: none;
        }
        .cv-paper {
          max-height: none;
        }
      }

      /* Hide footer when printing the CV */
      @media print {
        .app-footer { display: none !important; }
      }
    </style>
  </head>
  <body>
    <div class="app-container">
      <!-- ================= FORM ================= -->
      <div class="form-panel">
        <h2><i class="fas fa-file-pen"></i> CV Builder</h2>
        <div class="subhead">
          Fill in the details — live preview &amp; instant download.
        </div>

        <!-- Personal Info -->
        <div class="form-section">
          <div class="form-section-title">
            <i class="fas fa-user"></i> Personal Information
          </div>
          <div class="input-group">
            <label><i class="fas fa-user"></i> Full name</label>
            <input type="text" id="fullName" placeholder="Jane Doe" value="Jane Doe" />
          </div>
          <div class="input-group">
            <label><i class="fas fa-briefcase"></i> Professional title</label>
            <input type="text" id="title" placeholder="Customer Service Representative" value="Customer Service Representative" />
          </div>
        </div>

        <!-- Contact Details -->
        <div class="form-section">
          <div class="form-section-title">
            <i class="fas fa-address-card"></i> Contact Details
          </div>
          <div id="contactContainer"></div>
          <button class="add-btn" id="addContactBtn">
            <i class="fas fa-plus"></i> Add contact detail
          </button>
        </div>

        <!-- Location -->
        <div class="form-section">
          <div class="form-section-title">
            <i class="fas fa-location-dot"></i> Location
          </div>
          <div class="input-group">
            <input type="text" id="location" placeholder="City, Country" value="City, Country" />
          </div>
        </div>

        <!-- Executive Summary / Profile -->
        <div class="form-section">
          <div class="form-section-title">
            <i class="fas fa-align-left"></i> Executive Summary / Profile
          </div>
          <div class="input-group">
            <textarea id="profile" rows="3" placeholder="A short summary of your professional background and goals...">Reliable and customer-focused individual with strong communication skills and a solid work ethic. Experienced in delivering excellent service, handling transactions responsibly, and working effectively within a team. Eager to learn and contribute to a professional environment.</textarea>
          </div>
        </div>

        <!-- Work Experience -->
        <div class="form-section">
          <div class="form-section-title">
            <i class="fas fa-briefcase"></i> Work Experience
          </div>
          <div id="experienceContainer"></div>
          <button class="add-btn" id="addExperienceBtn">
            <i class="fas fa-plus"></i> Add work experience
          </button>
        </div>

        <!-- Education -->
        <div class="form-section">
          <div class="form-section-title">
            <i class="fas fa-graduation-cap"></i> Education
          </div>
          <div id="educationContainer"></div>
          <button class="add-btn" id="addEducationBtn">
            <i class="fas fa-plus"></i> Add education
          </button>
        </div>

        <!-- Skills -->
        <div class="form-section">
          <div class="form-section-title">
            <i class="fas fa-code"></i> Skills
          </div>
          <div class="input-group">
            <textarea id="skills" rows="2" placeholder="Customer service, Cash handling, Teamwork...">Customer service, Cash handling, Hygiene maintenance, Teamwork, Communication</textarea>
          </div>
        </div>

        <!-- References -->
        <div class="form-section">
          <div class="form-section-title">
            <i class="fas fa-address-book"></i> References
            <span style="font-weight: 400; text-transform: none; font-size: 0.75rem; color: #a0b3c6;">(optional)</span>
          </div>
          <div class="input-group">
            <textarea id="references" rows="2" placeholder="Available upon request">Available upon request</textarea>
          </div>
        </div>

        <div class="button-group">
          <button class="btn btn-primary" id="downloadPdfBtn">
            <i class="fas fa-file-pdf"></i> Download PDF
          </button>
          <button class="btn btn-outline" id="downloadDocxBtn">
            <i class="fas fa-file-word"></i> Download DOCX
          </button>
        </div>
      </div>

      <!-- ================= PREVIEW ================= -->
      <div class="preview-panel">
        <div class="preview-header">
          <h3><i class="fas fa-eye"></i> Live preview</h3>
          <span class="badge">A4 style</span>
        </div>
        <div id="cvPreview" class="cv-paper"></div>
      </div>
    </div>

    <!-- ================= FOOTER ================= -->
    <footer class="app-footer">
      Developed by Tinashe "Viz" Matembo &nbsp;·&nbsp;
      <a href="https://github.com/Vizz03/" target="_blank" rel="noopener noreferrer">
        <i class="fab fa-github"></i> github.com/Vizz03
      </a>
    </footer>

    <script>
      (function () {
        // ---------- DOM refs ----------
        const fullNameInput = document.getElementById("fullName");
        const titleInput = document.getElementById("title");
        const locationInput = document.getElementById("location");
        const profileInput = document.getElementById("profile");
        const skillsInput = document.getElementById("skills");
        const referencesInput = document.getElementById("references");
        const previewDiv = document.getElementById("cvPreview");
        const contactContainer = document.getElementById("contactContainer");
        const experienceContainer = document.getElementById("experienceContainer");
        const educationContainer = document.getElementById("educationContainer");

        // ---------- Helper ----------
        function escapeHtml(text) {
          if (!text) return "";
          return String(text)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
        }

        // ---------- CONTACT ----------
        function createContactItem(label = "", value = "") {
          const div = document.createElement("div");
          div.className = "contact-item";
          div.innerHTML = `
            <button class="remove-btn" title="Remove"><i class="fas fa-times-circle"></i></button>
            <div class="row-2">
              <div class="input-group">
                <label><i class="fas fa-tag"></i> Type</label>
                <input type="text" class="contact-label" placeholder="Email / Phone / LinkedIn" value="${escapeHtml(label)}">
              </div>
              <div class="input-group">
                <label><i class="fas fa-info-circle"></i> Value</label>
                <input type="text" class="contact-value" placeholder="jane@example.com" value="${escapeHtml(value)}">
              </div>
            </div>
          `;
          div.querySelector(".remove-btn").addEventListener("click", () => {
            div.remove();
            renderPreview();
          });
          div.querySelectorAll("input").forEach((i) => i.addEventListener("input", renderPreview));
          return div;
        }
        function addContactItem(label, value) {
          contactContainer.appendChild(createContactItem(label, value));
          renderPreview();
        }

        addContactItem("Email", "jane.doe@example.com");
        addContactItem("Phone", "+1 234 567 890");
        addContactItem("LinkedIn", "linkedin.com/in/janedoe");

        // ---------- EXPERIENCE ----------
        function createExperienceItem(jobTitle = "", company = "", dates = "", description = "") {
          const div = document.createElement("div");
          div.className = "exp-item";
          div.innerHTML = `
            <button class="remove-btn" title="Remove"><i class="fas fa-times-circle"></i></button>
            <div class="input-group">
              <label><i class="fas fa-user-tie"></i> Job title</label>
              <input type="text" class="exp-title" placeholder="Customer Service Representative" value="${escapeHtml(jobTitle)}">
            </div>
            <div class="row-2">
              <div class="input-group">
                <label><i class="fas fa-building"></i> Company</label>
                <input type="text" class="exp-company" placeholder="Company Name" value="${escapeHtml(company)}">
              </div>
              <div class="input-group">
                <label><i class="fas fa-calendar"></i> Start – End</label>
                <input type="text" class="exp-dates" placeholder="Jan 2023 – Present" value="${escapeHtml(dates)}">
              </div>
            </div>
            <div class="input-group">
              <label><i class="fas fa-list-check"></i> Description / Achievements</label>
              <textarea class="exp-desc" rows="2" placeholder="Describe your responsibilities and key achievements...">${escapeHtml(description)}</textarea>
            </div>
          `;
          div.querySelector(".remove-btn").addEventListener("click", () => {
            div.remove();
            renderPreview();
          });
          div.querySelectorAll("input, textarea").forEach((i) => i.addEventListener("input", renderPreview));
          return div;
        }
        function addExperienceItem(a, b, c, d) {
          experienceContainer.appendChild(createExperienceItem(a, b, c, d));
          renderPreview();
        }

        addExperienceItem(
          "Customer Service Representative",
          "Example Retail Ltd",
          "Jan 2023 – Present",
          "Greeted customers and handled enquiries professionally.\nProcessed payments and maintained a clean, organised work area."
        );
        addExperienceItem(
          "Sales Assistant",
          "Sample Store",
          "Jun 2021 – Dec 2022",
          "Assisted customers with product selection and purchases.\nRestocked shelves and ensured attractive product displays."
        );

        // ---------- EDUCATION ----------
        function createEducationItem(school = "", years = "", degree = "") {
          const div = document.createElement("div");
          div.className = "edu-item";
          div.innerHTML = `
            <button class="remove-btn" title="Remove"><i class="fas fa-times-circle"></i></button>
            <div class="input-group">
              <label><i class="fas fa-school"></i> School / Institution</label>
              <input type="text" class="edu-school" placeholder="Example High School" value="${escapeHtml(school)}">
            </div>
            <div class="row-2">
              <div class="input-group">
                <label><i class="fas fa-calendar"></i> Years</label>
                <input type="text" class="edu-years" placeholder="2018 – 2022" value="${escapeHtml(years)}">
              </div>
              <div class="input-group">
                <label><i class="fas fa-award"></i> Degree / Achievement</label>
                <input type="text" class="edu-degree" placeholder="High School Diploma" value="${escapeHtml(degree)}">
              </div>
            </div>
          `;
          div.querySelector(".remove-btn").addEventListener("click", () => {
            div.remove();
            renderPreview();
          });
          div.querySelectorAll("input").forEach((i) => i.addEventListener("input", renderPreview));
          return div;
        }
        function addEducationItem(a, b, c) {
          educationContainer.appendChild(createEducationItem(a, b, c));
          renderPreview();
        }

        addEducationItem("Example High School", "2018 – 2022", "High School Diploma");
        addEducationItem("Sample College", "2022 – 2024", "Certificate in Business Administration");

        // Add buttons
        document.getElementById("addContactBtn").addEventListener("click", () => addContactItem());
        document.getElementById("addExperienceBtn").addEventListener("click", () => addExperienceItem());
        document.getElementById("addEducationBtn").addEventListener("click", () => addEducationItem());

        // ---------- RENDER PREVIEW ----------
        function renderPreview() {
          const fullName = fullNameInput.value.trim() || "Your Name";
          const title = titleInput.value.trim() || "Professional Title";
          const location = locationInput.value.trim();
          const profile = profileInput.value.trim();
          const skills = skillsInput.value.trim();
          const references = referencesInput.value.trim();

          // Contacts
          const contactItems = contactContainer.querySelectorAll(".contact-item");
          const contactParts = [];
          contactItems.forEach((item) => {
            const label = item.querySelector(".contact-label")?.value.trim() || "";
            const value = item.querySelector(".contact-value")?.value.trim() || "";
            if (value) {
              const l = label.toLowerCase();
              const icon = l.includes("email")
                ? "fa-envelope"
                : l.includes("phone")
                ? "fa-phone"
                : l.includes("linkedin")
                ? "fa-linkedin"
                : l.includes("website")
                ? "fa-globe"
                : "fa-link";
              contactParts.push(`<span><i class="fas ${icon}"></i> ${escapeHtml(value)}</span>`);
            }
          });
          const contactHtml = contactParts.length
            ? `<div class="cv-contact">${contactParts.join("")}</div>`
            : "";

          // Location
          const locationHtml = location
            ? `<div style="margin-bottom:1rem;font-size:0.95rem;color:#3f5568;"><i class="fas fa-location-dot" style="color:#1e7ae6;width:16px;"></i> ${escapeHtml(location)}</div>`
            : "";

          // Profile
          const profileHtml = profile
            ? `<div class="cv-section"><div class="cv-section-title">Profile</div><div class="cv-text-block">${escapeHtml(profile).replace(/\n/g, "<br>")}</div></div>`
            : "";

          // Experience
          const expItems = experienceContainer.querySelectorAll(".exp-item");
          let expHtml = "";
          if (expItems.length) {
            let inner = "";
            expItems.forEach((item) => {
              const t = item.querySelector(".exp-title")?.value.trim() || "";
              const c = item.querySelector(".exp-company")?.value.trim() || "";
              const d = item.querySelector(".exp-dates")?.value.trim() || "";
              const de = item.querySelector(".exp-desc")?.value.trim() || "";
              if (t || c || d || de) {
                inner += `<div class="cv-item">
                  <div class="cv-item-title">${escapeHtml(t)}</div>
                  <div class="cv-item-sub">${escapeHtml(c)}${c && d ? " · " : ""}${escapeHtml(d)}</div>
                  ${de ? `<div class="cv-item-desc">${escapeHtml(de).replace(/\n/g, "<br>")}</div>` : ""}
                </div>`;
              }
            });
            if (inner) expHtml = `<div class="cv-section"><div class="cv-section-title">Work Experience</div>${inner}</div>`;
          }

          // Education
          const eduItems = educationContainer.querySelectorAll(".edu-item");
          let eduHtml = "";
          if (eduItems.length) {
            let inner = "";
            eduItems.forEach((item) => {
              const s = item.querySelector(".edu-school")?.value.trim() || "";
              const y = item.querySelector(".edu-years")?.value.trim() || "";
              const dg = item.querySelector(".edu-degree")?.value.trim() || "";
              if (s || y || dg) {
                inner += `<div class="cv-item">
                  <div class="cv-item-title">${escapeHtml(s)}</div>
                  <div class="cv-item-sub">${escapeHtml(y)}${y && dg ? " · " : ""}${escapeHtml(dg)}</div>
                </div>`;
              }
            });
            if (inner) eduHtml = `<div class="cv-section"><div class="cv-section-title">Education</div>${inner}</div>`;
          }

          // Skills
          const skillsHtml = skills
            ? `<div class="cv-section"><div class="cv-section-title">Skills</div><div class="cv-text-block">${escapeHtml(skills).replace(/\n/g, "<br>")}</div></div>`
            : "";

          // References
          const refHtml = references
            ? `<div class="cv-section"><div class="cv-section-title">References</div><div class="cv-text-block">${escapeHtml(references).replace(/\n/g, "<br>")}</div></div>`
            : "";

          previewDiv.innerHTML = `
            <div class="cv-name">${escapeHtml(fullName)}</div>
            <div class="cv-title">${escapeHtml(title)}</div>
            ${contactHtml}
            ${locationHtml}
            ${profileHtml}
            ${expHtml}
            ${eduHtml}
            ${skillsHtml}
            ${refHtml}
          `;
        }

        // Live preview listeners
        [fullNameInput, titleInput, locationInput, profileInput, skillsInput, referencesInput].forEach((i) =>
          i.addEventListener("input", renderPreview)
        );
        renderPreview();

        // ============================================================
        // PDF DOWNLOAD — native browser print
        // ============================================================
        document.getElementById("downloadPdfBtn").addEventListener("click", function () {
          const printStyle = document.createElement("style");
          printStyle.id = "cv-print-style";
          printStyle.textContent = `
            @page { size: A4 portrait; margin: 15mm; }
            @media print {
              body * { visibility: hidden !important; }
              #cvPreview, #cvPreview * { visibility: visible !important; }
              #cvPreview {
                position: absolute !important;
                left: 0 !important;
                top: 0 !important;
                width: 100% !important;
                max-width: 100% !important;
                max-height: none !important;
                overflow: visible !important;
                box-shadow: none !important;
                border: none !important;
                border-radius: 0 !important;
                padding: 0 !important;
                margin: 0 !important;
                background: #fff !important;
              }
              .cv-item, .cv-section, .cv-contact { break-inside: avoid; page-break-inside: avoid; }
              .cv-section-title { break-after: avoid; page-break-after: avoid; }
              .cv-contact i, .cv-section-title i, .cv-item i, .cv-text-block i {
                color: #1e7ae6 !important;
              }
              .preview-panel, .app-container { display: block !important; }
              .preview-panel { position: static !important; }
              .app-footer { display: none !important; }
            }
          `;
          document.head.appendChild(printStyle);
          window.print();
          setTimeout(() => {
            const el = document.getElementById("cv-print-style");
            if (el) el.remove();
          }, 1000);
        });

        // ============================================================
        // DOCX DOWNLOAD — plain & professional (docx@7.8.2)
        // ============================================================
        document.getElementById("downloadDocxBtn").addEventListener("click", async function () {
          try {
            if (typeof docx === "undefined")
              throw new Error("docx library failed to load — check your internet connection.");

            const { Document, Packer, Paragraph, TextRun, BorderStyle } = docx;

            const fullName = fullNameInput.value.trim() || "Your Name";
            const title = titleInput.value.trim() || "Professional Title";
            const location = locationInput.value.trim();
            const profile = profileInput.value.trim();
            const skills = skillsInput.value.trim();
            const references = referencesInput.value.trim();

            const contactStrings = [];
            contactContainer.querySelectorAll(".contact-item").forEach((item) => {
              const label = item.querySelector(".contact-label")?.value.trim() || "";
              const value = item.querySelector(".contact-value")?.value.trim() || "";
              if (value) contactStrings.push(label ? `${label}: ${value}` : value);
            });

            const exps = [];
            experienceContainer.querySelectorAll(".exp-item").forEach((item) => {
              const t = item.querySelector(".exp-title")?.value.trim() || "";
              const c = item.querySelector(".exp-company")?.value.trim() || "";
              const d = item.querySelector(".exp-dates")?.value.trim() || "";
              const de = item.querySelector(".exp-desc")?.value.trim() || "";
              if (t || c || d || de) exps.push({ t, c, d, de });
            });

            const edus = [];
            educationContainer.querySelectorAll(".edu-item").forEach((item) => {
              const s = item.querySelector(".edu-school")?.value.trim() || "";
              const y = item.querySelector(".edu-years")?.value.trim() || "";
              const dg = item.querySelector(".edu-degree")?.value.trim() || "";
              if (s || y || dg) edus.push({ s, y, dg });
            });

            const children = [];

            const sectionHeading = (text) =>
              new Paragraph({
                spacing: { before: 300, after: 120 },
                border: {
                  bottom: { color: "1E7AE6", space: 4, style: BorderStyle.SINGLE, size: 8 },
                },
                children: [
                  new TextRun({
                    text: text.toUpperCase(),
                    bold: true,
                    size: 26,
                    color: "0B1C2E",
                    font: "Calibri",
                  }),
                ],
              });

            children.push(
              new Paragraph({
                spacing: { after: 60 },
                children: [new TextRun({ text: fullName, bold: true, size: 48, color: "0B1C2E", font: "Calibri" })],
              })
            );
            children.push(
              new Paragraph({
                spacing: { after: 120 },
                children: [new TextRun({ text: title, size: 26, color: "1E7AE6", font: "Calibri" })],
              })
            );

            if (contactStrings.length) {
              children.push(
                new Paragraph({
                  spacing: { after: 80 },
                  children: [new TextRun({ text: contactStrings.join("   |   "), size: 22, color: "3F5568", font: "Calibri" })],
                })
              );
            }
            if (location) {
              children.push(
                new Paragraph({
                  spacing: { after: 160 },
                  children: [new TextRun({ text: location, size: 22, color: "3F5568", font: "Calibri" })],
                })
              );
            }

            if (profile) {
              children.push(sectionHeading("Profile"));
              profile.split("\n").forEach((line) => {
                if (line.trim())
                  children.push(
                    new Paragraph({
                      spacing: { after: 80 },
                      children: [new TextRun({ text: line.trim(), size: 22, color: "2E4052", font: "Calibri" })],
                    })
                  );
              });
            }

            if (exps.length) {
              children.push(sectionHeading("Work Experience"));
              exps.forEach((exp, i) => {
                if (exp.t)
                  children.push(
                    new Paragraph({
                      spacing: { before: i === 0 ? 0 : 120, after: 20 },
                      children: [new TextRun({ text: exp.t, bold: true, size: 24, color: "0B1C2E", font: "Calibri" })],
                    })
                  );
                const sub = [exp.c, exp.d].filter(Boolean).join(" · ");
                if (sub)
                  children.push(
                    new Paragraph({
                      spacing: { after: 60 },
                      children: [new TextRun({ text: sub, italics: true, size: 22, color: "1E7AE6", font: "Calibri" })],
                    })
                  );
                if (exp.de)
                  exp.de.split("\n").forEach((line) => {
                    if (line.trim())
                      children.push(
                        new Paragraph({
                          spacing: { after: 60 },
                          children: [new TextRun({ text: line.trim(), size: 22, color: "2E4052", font: "Calibri" })],
                        })
                      );
                  });
              });
            }

            if (edus.length) {
              children.push(sectionHeading("Education"));
              edus.forEach((edu, i) => {
                if (edu.s)
                  children.push(
                    new Paragraph({
                      spacing: { before: i === 0 ? 0 : 120, after: 20 },
                      children: [new TextRun({ text: edu.s, bold: true, size: 24, color: "0B1C2E", font: "Calibri" })],
                    })
                  );
                const sub = [edu.y, edu.dg].filter(Boolean).join(" · ");
                if (sub)
                  children.push(
                    new Paragraph({
                      spacing: { after: 60 },
                      children: [new TextRun({ text: sub, size: 22, color: "1E7AE6", font: "Calibri" })],
                    })
                  );
              });
            }

            if (skills) {
              children.push(sectionHeading("Skills"));
              skills.split("\n").forEach((line) => {
                if (line.trim())
                  children.push(
                    new Paragraph({
                      spacing: { after: 60 },
                      children: [new TextRun({ text: line.trim(), size: 22, color: "2E4052", font: "Calibri" })],
                    })
                  );
              });
            }

            if (references) {
              children.push(sectionHeading("References"));
              references.split("\n").forEach((line) => {
                if (line.trim())
                  children.push(
                    new Paragraph({
                      spacing: { after: 60 },
                      children: [new TextRun({ text: line.trim(), size: 22, color: "2E4052", font: "Calibri" })],
                    })
                  );
              });
            }

            const doc = new Document({
              styles: { default: { document: { run: { font: "Calibri", size: 22 } } } },
              sections: [
                {
                  properties: {
                    page: { margin: { top: 720, right: 720, bottom: 720, left: 720 } },
                  },
                  children: children,
                },
              ],
            });

            const blob = await Packer.toBlob(doc);
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `${fullName.replace(/\s+/g, "_")}_CV.docx`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => window.URL.revokeObjectURL(url), 1000);
          } catch (err) {
            console.error("DOCX generation error:", err);
            alert(
              "DOCX generation failed:\n\n" +
                err.message +
                "\n\nPlease open DevTools (F12) → Console and share the full error if this persists."
            );
          }
        });
      })();
    </script>
  </body>
</html>
